[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillscan-trace"
version = "1.0.0"
description = "Behavioral execution engine for MCP-based AI agent skills"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["security", "ai", "agents", "mcp", "behavioral-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

dependencies = [
    "click>=8.0",
    "openai>=1.0",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "jsonschema>=4.0",
    "rich>=13.0",
    "requests>=2.0",
    "bashlex>=0.18",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "boto3>=1.34",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
    "types-requests>=2.0",
]

[project.scripts]
skillscan-trace = "skillscan_trace.cli:main"

[project.urls]
Repository = "https://github.com/kurtpayne/skillscan-trace"
Issues = "https://github.com/kurtpayne/skillscan-trace/issues"
"skillscan-security" = "https://github.com/kurtpayne/skillscan-security"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "skillscan_trace.canary.bash_ast"
# bashlex has no stubs; --ignore-missing-imports suppresses the import error
# making type: ignore[import-untyped] unused. Disable unused-ignore here.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "skillscan_trace.judge.judges"
# Optional SDK imports (anthropic) may or may not be installed; the
# type: ignore comments are needed in some environments but not others.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "skillscan_trace.serve"
# FastAPI's route decorators are untyped in some environments.
# Disable decorator typing checks for the serve module.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "skillscan_trace.canary.server"
# MCP's @mcp.tool() decorators are untyped.
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
