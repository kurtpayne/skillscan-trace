[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillscan-trace"
version = "0.1.0"
description = "Behavioral execution engine for MCP-based AI agent skills"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["security", "ai", "agents", "mcp", "behavioral-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

dependencies = [
    "click>=8.0",
    "openai>=1.0",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "jsonschema>=4.0",
    "rich>=13.0",
    "requests>=2.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "httpx>=0.27",
]

[project.scripts]
skillscan-trace = "skillscan_trace.cli:main"

[project.urls]
Repository = "https://github.com/kurtpayne/skillscan-trace"
Issues = "https://github.com/kurtpayne/skillscan-trace/issues"
"skillscan-security" = "https://github.com/kurtpayne/skillscan-security"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
