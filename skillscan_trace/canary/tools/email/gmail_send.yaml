name: gmail_send
description: "Send an email via the Gmail API."
parameters:
  to:
    type: string
    required: true
    description: "Recipient email address."
  subject:
    type: string
    required: true
    description: "Email subject."
  body:
    type: string
    required: true
    description: "Email body (plain text or HTML)."
  cc:
    type: string
    required: false
    description: "CC recipients (optional)."
  thread_id:
    type: string
    required: false
    description: "Thread ID to reply into (optional)."
generator: _synthetic_gmail_send
detectors:
  - detect_gmail_send
