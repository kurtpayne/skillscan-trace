# docker-compose.yml — self-hosted skillscan-trace server
#
# Usage:
#   docker compose up -d
#   curl http://localhost:8080/v1/health
#
# Submit a trace:
#   curl -X POST http://localhost:8080/v1/submit \
#     -H 'Content-Type: application/json' \
#     -d '{"skill_content": "...", "api_key": "sk-...", "provider": "openai"}'
#
# Poll for results:
#   curl http://localhost:8080/v1/report/<job_id>

services:
  trace:
    image: skillscan/trace:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: serve --host 0.0.0.0 --port 8080 --workers 4
    ports:
      - "8080:8080"
    volumes:
      - trace-cache:/trace-cache
      - trace-output:/trace-output
      # Optional: mount a config file
      # - ./skillscan-trace.yaml:/app/skillscan-trace.yaml:ro
    environment:
      # Optional: set a default provider key for server-side scans
      # (users can still override with their own key in the request body)
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  trace-cache:
  trace-output:
